<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket Quant Opportunity Scanner</title>
<style>
  :root { --bg:#0b0f17; --card:#121826; --line:#1f2937; --txt:#e5e7eb; --mut:#8b95a7;
          --arb:#22c55e; --arbo:#06b6d4; --yield:#eab308; --mm:#a855f7; --sig:#64748b; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
         background: var(--bg); color: var(--txt); }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size: 18px; margin:0; letter-spacing:.2px; }
  .spacer { flex:1; }
  .pill { padding: 4px 11px; border-radius: 999px; background: var(--card); border:1px solid var(--line); color: var(--mut); font-size:12px; text-decoration:none; }
  .pill.btn { color: var(--txt); cursor:pointer; }
  .pill.btn:hover, .pill.btn.active { border-color:#3b82f6; background:#1e293b; }
  .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:12px; padding: 16px 24px; }
  .stat { background: var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .stat b { display:block; font-size:20px; margin-top:2px; }
  .stat span { color: var(--mut); font-size:12px; }
  . filters, .filters { padding: 0 24px 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .filters button { background: var(--card); color: var(--txt); border:1px solid var(--line); padding:6px 12px; border-radius:8px; cursor:pointer; }
  .filters button.on { border-color:#3b82f6; background:#1e293b; }
  .filters input { background: var(--card); color: var(--txt); border:1px solid var(--line); padding:6px 10px; border-radius:8px; min-width:240px; }
  .port-box { margin: 0 24px 18px; background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 14px 18px; display:none; }
  .port-box.show { display:block; }
  .port-hdr { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .port-hdr h2 { font-size:15px; margin:0; }
  .port-metrics { display:flex; gap:18px; flex-wrap:wrap; font-size:13px; color: var(--mut); }
  .port-metrics b { color: var(--txt); }
  table { width: calc(100% - 48px); margin: 0 24px 40px; border-collapse: collapse; }
  .port-box table { width: 100%; margin: 8px 0 0; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align:left; vertical-align: top; }
  th { color: var(--mut); font-weight:500; font-size:12px; position: sticky; top:0; background: var(--bg); cursor:pointer; }
  .port-box th { background: var(--card); position:static; }
  td.num { text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  tr.row:hover { background:#0f1522; cursor:pointer; }
  .k { font-weight:600; font-size:11px; padding:2px 7px; border-radius:6px; color:#0b0f17; }
  .ARB { background: var(--arb); } .ARB\* { background: var(--arbo); } .YIELD { background: var(--yield); }
  .MM { background: var(--mm); } .SIGNAL { background: var(--sig); color:#fff; }
  .ev { color: var(--mut); font-size:12px; }
  a { color:#60a5fa; text-decoration:none; }
  .detail td { background:#0f1522; color: var(--mut); font-size: 13px; }
  .detail ul { margin:6px 0; padding-left:18px; }
  .legs { width:100%; margin:6px 0; }
  .legs td { padding:3px 8px; border:0; }
  .pos { color: var(--arb); } .warn { color: #f87171; }
</style>
</head>
<body>
<header>
  <h1>⚡ Polymarket Quant Opportunity Scanner</h1>
  <span class="pill" id="status">loading…</span>
  <span class="pill" id="ts"></span>
  <div class="spacer"></div>
  <button class="pill btn" id="btnPort">📊 Quant Portfolio</button>
  <button class="pill btn" id="btnEn">EN</button>
  <button class="pill btn" id="btnTh">ไทย</button>
  <a class="pill btn" href="https://github.com/83mhpll/polymarket-quant-scanner" target="_blank">GitHub Docs ↗</a>
</header>
<div class="stats" id="stats"></div>
<div class="port-box show" id="portBox"></div>
<div class="filters" id="filters">
  <button data-k="ALL" class="on" data-en="All" data-th="ทั้งหมด">All</button>
  <button data-k="ARB" data-en="ARB (Locked)" data-th="ARB (ล็อกกำไร)">ARB (Locked)</button>
  <button data-k="ARB*" data-en="ARB* (On-Chain)" data-th="ARB* (on-chain)">ARB* (On-Chain)</button>
  <button data-k="MM" data-en="MM Rewards" data-th="MM Rewards">MM Rewards</button>
  <button data-k="YIELD" data-en="Endgame Yield" data-th="Endgame Yield">Endgame Yield</button>
  <button data-k="SIGNAL" data-en="Signals" data-th="Signals">Signals</button>
  <input id="q" placeholder="Search event / market…" data-en-ph="Search event / market…" data-th-ph="ค้นหา event / market…">
</div>
<table>
  <thead><tr>
    <th data-s="kind" data-en="Kind" data-th="ประเภท">Kind</th>
    <th data-s="event_title" data-en="Opportunity" data-th="โอกาส">Opportunity</th>
    <th data-s="capital" class="num" data-en="Capital $" data-th="ทุน $">Capital $</th>
    <th data-s="exp_profit" class="num" data-en="Profit $" data-th="กำไร $">Profit $</th>
    <th data-s="roi" class="num">ROI</th>
    <th data-s="days" class="num" data-en="Days" data-th="วัน">Days</th>
    <th data-s="apr" class="num">APR</th>
    <th data-s="confidence" class="num">Conf</th>
    <th data-s="score" class="num">Score</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
let data = {opportunities: []}, kind = "ALL", sortKey = "score", sortDir = -1, open = new Set();
let lang = localStorage.getItem("polyscan_lang") || "en";
const $ = s => document.querySelector(s);
const fmt = (v, d=2) => v == null ? "–" : Number(v).toLocaleString(undefined, {minimumFractionDigits:d, maximumFractionDigits:d});
const pct = v => v == null ? "–" : (Math.abs(v) > 50 ? ">5000%" : (v*100).toFixed(2) + "%");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#btnPort").onclick = () => $("#portBox").classList.toggle("show");

const I18N = {
  en: {
    scanning: "🔄 scanning…", idle: "✅ idle", offline: "offline",
    lastScan: (t, d, iv) => `last scan ${t} · ${d}s` + (iv ? ` · every ${iv}s` : ""),
    stats: ["Markets scanned", "Order books", "Opportunities", "Locked arbs", "Optimal Portfolio Profit", "Portfolio Sharpe / VaR95"],
    execHint: id => `<code>python3 -m polyscan execute ${id}</code> (dry-run) · add <code>--live</code> for live execution`,
    portTitle: "🧠 AI Quant Portfolio Optimizer (Fractional Kelly + Event Correlation Caps)",
    portCols: ["Kind", "Strategy", "Market / Sizing Rationale", "Alloc $", "Kelly %", "Exp. Profit $", "ROI"],
  },
  th: {
    scanning: "🔄 กำลังสแกน…", idle: "✅ พร้อมใช้งาน", offline: "ออฟไลน์",
    lastScan: (t, d, iv) => `สแกนล่าสุด ${t} · ${d} วินาที` + (iv ? ` · ทุก ${iv} วินาที` : ""),
    stats: ["ตลาดที่สแกน", "สมุดคำสั่ง (Books)", "โอกาสทั้งหมด", "อาร์บิทราจล็อกกำไร", "กำไรพอร์ตเหมาะสมที่สุด", "Sharpe / VaR95 ของพอร์ต"],
    execHint: id => `<code>python3 -m polyscan execute ${id}</code> (dry-run) · เพิ่ม <code>--live</code> เพื่อส่งคำสั่งจริง`,
    portTitle: "🧠 พอร์ตโฟลิโออัจฉริยะ (Fractional Kelly + จำกัดความเสี่ยงรายอีเวนต์)",
    portCols: ["ประเภท", "กลยุทธ์", "ตลาด / เหตุผลการคำนวณขนาดไม้", "จัดสรร $", "Kelly %", "กำไรคาดการณ์ $", "ROI"],
  }
};

function translateNote(n) {
  if (lang === "th") return n;
  return String(n)
    .replace(/รางวัลคาดการณ์ \$([\d.,]+)\/วัน \(([\d.,]+%)\/วัน\), หัก adverse-selection ≈ \$([\d.,]+)\/วัน/, "Est. reward $$$1/day ($2/day), less adverse-selection ≈ $$$3/day")
    .replace(/ต้องอยู่ใน band (±[\d.,]+¢) และ size ≥ ([\d.,]+) shares/, "Must quote within $1 band with size ≥ $2 shares")
    .replace(/ต้องอยู่ใน band (±[\d.,]+¢) จาก mid และ size ≥ ([\d.,]+) shares.*/, "Must quote within $1 of mid with size ≥ $2 shares (both sides)")
    .replace(/เป็น maker \(ค่าธรรมเนียม 0\) — ยกเลิก\/ปรับ quote เมื่อ mid เคลื่อน/, "0% Maker fee — cancel/re-quote when midpoint shifts")
    .replace(/ขาดทุนสูงสุด \$([\d.,]+) ถ้าผิด/, "max loss $$$1 if wrong")
    .replace(/ผลตอบแทน ([\d.,]+%) ใน ~([\d.,]+) วัน \(APR ([\d.,]+%)\)/, "Return $1 over ~$2 days (APR $3)")
    .replace(/เลยวันสิ้นสุดแล้ว — รอ UMA resolve.*/, "Past end date — awaiting UMA resolution")
    .replace(/⚠️ มีประวัติ dispute ใน UMA/, "⚠️ Active or historical UMA dispute")
    .replace(/⚠️ ราคาเคลื่อน ([^\s]+) ใน 24 ชม\. — ตลาดยังไม่นิ่ง/, "⚠️ Price moved $1 in 24h — market still volatile")
    .replace(/สัญญาณเชิงสถิติ — มีความเสี่ยงทิศทาง ใช้ stop-loss เสมอ/, "Statistical signal — carries directional risk; always enforce stop-loss")
    .replace(/ตรรกะ: '([^']+)' ⇒ '([^']+)'.*/, "Logic: '$1' ⇒ '$2' (monotonicity requirement P(strong) ≤ P(weak))")
    .replace(/วิธีเข้า: วาง GTC Maker Bid ที่ '([^']+)' \(ค่าธรรมเนียม 0%\) เมื่อแมตช์แล้วส่ง FOK Taker ที่ '([^']+)'/, "Execution: post GTC Maker Bid on '$1' (0% fee), then send FOK Taker on '$2' upon fill")
    .replace(/ประหยัดค่าธรรมเนียมขา Maker ทำให้อาร์บิทราจมีกำไรสุทธิ \+\$([\d.,]+)/, "Saving Maker fee yields net locked profit of +$$$1");
}

function setLang(l) {
  lang = l;
  localStorage.setItem("polyscan_lang", l);
  document.documentElement.lang = l;
  $("#btnEn").classList.toggle("active", l === "en");
  $("#btnTh").classList.toggle("active", l === "th");
  document.querySelectorAll("[data-en]").forEach(el => { el.textContent = el.dataset[l]; });
  $("#q").placeholder = $("#q").dataset[l + "Ph"];
  render();
}
$("#btnEn").onclick = () => setLang("en");
$("#btnTh").onclick = () => setLang("th");

async function load() {
  for (const url of ["/api/result", "./latest.json"]) {
    try {
      const r = await fetch(url, {cache: "no-store"});
      if (r.ok) { data = await r.json(); render(); return; }
    } catch (e) {}
  }
  $("#status").textContent = I18N[lang].offline;
}

function renderPortfolio() {
  const p = data.portfolio;
  if (!p || !p.allocations || !p.allocations.length) { $("#portBox").innerHTML = ""; return; }
  const t = I18N[lang];
  const mtm = data.paper_mtm || {};
  const mtmStr = mtm.n_positions ? ` · Paper MTM PnL: <b>$${fmt(mtm.unrealized_pnl_usd)}</b> (${mtm.n_positions} pos)` : "";
  const rows = p.allocations.slice(0, 12).map(a => {
    const rat = lang === "en" ? (a.rationale_en || a.rationale_th) : (a.rationale_th || a.rationale_en);
    return `<tr>
      <td><span class="k ${esc(a.kind)}">${esc(a.kind)}</span></td>
      <td class="ev">${esc(a.strategy)}</td>
      <td><div><b>${esc(a.title)}</b> · <a href="${esc(a.url)}" target="_blank">↗</a></div><div class="ev">${esc(a.event_title)} — ${esc(rat)}</div></td>
      <td class="num">$${fmt(a.recommended_usd)}</td>
      <td class="num">${pct(a.kelly_pct)}</td>
      <td class="num pos">+$${fmt(a.expected_profit_usd)}</td>
      <td class="num">${pct(a.roi)}</td>
    </tr>`;
  }).join("");
  $("#portBox").innerHTML = `
    <div class="port-hdr">
      <h2>${t.portTitle}</h2>
      <div class="port-metrics">
        <span>Allocated: <b>$${fmt(p.total_allocated_usd,0)} / $${fmt(p.bankroll_usd,0)} (${pct(p.utilization_pct)})</b></span>
        <span>Exp. Profit: <b class="pos">+$${fmt(p.expected_profit_usd)} (${pct(p.portfolio_roi)})</b></span>
        <span>95% VaR: <b>$${fmt(p.var_95_usd)}</b></span>
        <span>Max Event Stress: <b>$${fmt(p.max_drawdown_stress_usd)}</b></span>
        <span>Sharpe: <b>${fmt(p.sharpe_proxy)}</b>${mtmStr}</span>
      </div>
    </div>
    <table><thead><tr>
      <th>${t.portCols[0]}</th><th>${t.portCols[1]}</th><th>${t.portCols[2]}</th>
      <th class="num">${t.portCols[3]}</th><th class="num">${t.portCols[4]}</th>
      <th class="num">${t.portCols[5]}</th><th class="num">${t.portCols[6]}</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

function render() {
  const t = I18N[lang];
  $("#status").textContent = data.scanning ? t.scanning : (data.last_error ? "⚠️ " + data.last_error : t.idle);
  $("#ts").textContent = data.timestamp ? t.lastScan(new Date(data.timestamp).toLocaleTimeString(), data.duration_s, data.interval) : "";
  const ops = data.opportunities || [];
  const arb = ops.filter(o => o.kind === "ARB");
  const p = data.portfolio || {};
  const stats = [
    [t.stats[0], fmt(data.n_markets, 0)], [t.stats[1], fmt(data.n_books, 0)],
    [t.stats[2], fmt(ops.length, 0)], [t.stats[3], fmt(arb.length, 0)],
    [t.stats[4], "$" + fmt(p.expected_profit_usd ?? arb.reduce((a, o) => a + o.exp_profit, 0))],
    [t.stats[5], `${fmt(p.sharpe_proxy ?? 0)} / $${fmt(p.var_95_usd ?? 0)}`],
  ];
  $("#stats").innerHTML = stats.map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("");
  renderPortfolio();
  const q = $("#q").value.toLowerCase();
  let rows = ops.filter(o => (kind === "ALL" || o.kind === kind) &&
    (!q || (o.event_title + " " + o.title).toLowerCase().includes(q)));
  rows.sort((a, b) => ((a[sortKey] ?? -1e18) > (b[sortKey] ?? -1e18) ? 1 : -1) * sortDir);
  $("#rows").innerHTML = rows.slice(0, 400).map(o => {
    const main = `<tr class="row" data-id="${o.id}">
      <td><span class="k ${esc(o.kind)}">${esc(o.kind)}</span><div class="ev">${esc(o.strategy)}</div></td>
      <td><div>${esc(o.title)}</div><div class="ev">${esc(o.event_title)} · <a href="${esc(o.url)}" target="_blank">open ↗</a> · id ${o.id}</div></td>
      <td class="num">${fmt(o.capital, 0)}</td><td class="num pos">${fmt(o.exp_profit)}</td>
      <td class="num">${pct(o.roi)}</td><td class="num">${o.days == null ? "–" : fmt(o.days, 1)}</td>
      <td class="num">${pct(o.apr)}</td><td class="num">${fmt(o.confidence)}</td><td class="num">${fmt(o.score)}</td></tr>`;
    if (!open.has(o.id)) return main;
    const legs = o.legs.map(l => `<tr><td>${esc(l.side)}</td><td>${fmt(l.size)} sh</td><td>${esc(l.outcome)}</td>
      <td>avg ${fmt(l.avg_price, 4)}</td><td>limit ${fmt(l.price_limit, 4)}</td></tr>`).join("");
    const rawNotes = (lang === "en" && o.notes_en && o.notes_en.length) ? o.notes_en : (o.notes || []);
    const notes = rawNotes.map(n => `<li>${esc(translateNote(n))}</li>`).join("");
    return main + `<tr class="detail"><td></td><td colspan="8"><table class="legs">${legs}</table><ul>${notes}</ul>
      ${t.execHint(o.id)}</td></tr>`;
  }).join("");
  document.querySelectorAll("tr.row").forEach(tr => tr.onclick = e => {
    if (e.target.tagName === "A") return;
    const id = tr.dataset.id; open.has(id) ? open.delete(id) : open.add(id); render();
  });
}
document.querySelectorAll("#filters button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#filters button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); kind = b.dataset.k; render();
});
document.querySelectorAll("th").forEach(th => th.onclick = () => {
  const k = th.dataset.s; if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; } render();
});
$("#q").oninput = render;
setLang(lang);
load(); setInterval(load, 5000);
</script>
</body>
</html>
